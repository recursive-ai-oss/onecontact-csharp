name: ci

# Builds and tests on every platform we support, publishes the NativeAOT smoke app with warnings as errors, and checks that the
# packages pack with their licences and notices. Nothing here publishes a package.
on:
  push:
    branches: [main, 'ci-check/**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONECONTACT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch upstream data
        shell: bash
        run: |
          echo "ONECONTACT_UPSTREAM=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"
          ONECONTACT_UPSTREAM="$RUNNER_TEMP/upstream" tools/fetch/all.sh
      - name: Build
        run: dotnet build OneContact.slnx -c Release
      - name: Test
        run: dotnet test --solution OneContact.slnx -c Release --no-build
      - name: Run the README quick start
        run: dotnet run --project samples/OneContact.QuickStart -c Release --no-build

  aot:
    # The library must publish with NativeAOT without a single trim or AOT warning, and the published app must run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONECONTACT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch upstream data
        shell: bash
        run: |
          echo "ONECONTACT_UPSTREAM=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"
          ONECONTACT_UPSTREAM="$RUNNER_TEMP/upstream" tools/fetch/all.sh
      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish the smoke app (warnings are errors)
        run: dotnet publish samples/OneContact.AotSmoke -c Release -r linux-x64 -o "$RUNNER_TEMP/smoke" -warnaserror
      - name: Run the smoke app
        run: '"$RUNNER_TEMP/smoke/RecursiveAI.OneContact.AotSmoke"'

  pack:
    # Builds the packages as an artifact only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONECONTACT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch upstream data
        shell: bash
        run: |
          echo "ONECONTACT_UPSTREAM=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"
          ONECONTACT_UPSTREAM="$RUNNER_TEMP/upstream" tools/fetch/all.sh
      - name: Pack
        run: dotnet pack OneContact.slnx -c Release -o "$RUNNER_TEMP/packages"
      - name: Packages carry both licences, the notices and the readme
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/packages/*.nupkg)
          [ "${#packages[@]}" -ge 2 ] || { echo "::error::expected at least two packages"; exit 1; }
          for p in "${packages[@]}"; do
            listing=$(unzip -Z1 "$p")
            for f in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md PACKAGE.md; do
              grep -qx "$f" <<<"$listing" || { echo "::error::$(basename "$p") has no $f"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
